<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador PCGE - Plan Contable General Empresarial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-5 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-white/10 p-3 rounded-xl backdrop-blur-sm border border-white/20">
                    <i class="fa-solid fa-book-open text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Buscador PCGE</h1>
                    <p class="text-xs sm:text-sm text-blue-100 opacity-90">Plan Contable General Empresarial (Perú)</p>
                </div>
            </div>
            <div class="bg-white/10 px-3 py-1.5 rounded-lg text-xs font-medium tracking-wide border border-white/10">
                <i class="fa-solid fa-shield-halved mr-1.5"></i> Actualizado
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- Search Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-7 mb-6 transition-all focus-within:shadow-md">
            <label for="search-input" class="block text-sm font-semibold text-slate-700 mb-2">
                <i class="fa-solid fa-magnifying-glass text-blue-600 mr-1.5"></i> Ingresa número de cuenta o nombre:
            </label>
            <div class="relative">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Ej. 1042, 12, Mercaderías, Tributos..." 
                    class="w-full pl-4 pr-12 py-3.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all text-lg font-medium"
                    autocomplete="off"
                    autofocus
                >
                <button id="clear-btn" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-2 hidden transition-colors" title="Limpiar">
                    <i class="fa-solid fa-circle-xmark text-lg"></i>
                </button>
            </div>

            <!-- Quick Filter Badges -->
            <div class="mt-4 flex flex-wrap gap-2 items-center text-xs">
                <span class="text-slate-500 font-medium mr-1">Elementos:</span>
                <button onclick="filterByElement('1')" class="px-2.5 py-1 bg-blue-50 text-blue-700 rounded-lg border border-blue-200 hover:bg-blue-100 transition-colors">1. Activo</button>
                <button onclick="filterByElement('2')" class="px-2.5 py-1 bg-amber-50 text-amber-700 rounded-lg border border-amber-200 hover:bg-amber-100 transition-colors">2. Activo Realizable</button>
                <button onclick="filterByElement('3')" class="px-2.5 py-1 bg-emerald-50 text-emerald-700 rounded-lg border border-emerald-200 hover:bg-emerald-100 transition-colors">3. Activo Inmovilizado</button>
                <button onclick="filterByElement('4')" class="px-2.5 py-1 bg-rose-50 text-rose-700 rounded-lg border border-rose-200 hover:bg-rose-100 transition-colors">4. Pasivo</button>
                <button onclick="filterByElement('5')" class="px-2.5 py-1 bg-purple-50 text-purple-700 rounded-lg border border-purple-200 hover:bg-purple-100 transition-colors">5. Patrimonio</button>
                <button onclick="filterByElement('6')" class="px-2.5 py-1 bg-orange-50 text-orange-700 rounded-lg border border-orange-200 hover:bg-orange-100 transition-colors">6. Gastos</button>
                <button onclick="filterByElement('7')" class="px-2.5 py-1 bg-teal-50 text-teal-700 rounded-lg border border-teal-200 hover:bg-teal-100 transition-colors">7. Ingresos</button>
                <button onclick="filterByElement('8')" class="px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-lg border border-indigo-200 hover:bg-indigo-100 transition-colors">8. Gastos / Ingresos Fin.</button>
                <button onclick="filterByElement('9')" class="px-2.5 py-1 bg-slate-100 text-slate-700 rounded-lg border border-slate-300 hover:bg-slate-200 transition-colors">9. Analítica</button>
            </div>
        </div>

        <!-- Results Section -->
        <div id="results-container" class="space-y-4">
            <!-- Initial state -->
            <div class="bg-white border border-dashed border-slate-300 rounded-2xl p-8 text-center text-slate-500">
                <i class="fa-solid fa-file-invoice text-4xl text-blue-500 mb-3 opacity-80"></i>
                <h3 class="font-semibold text-slate-700 text-base">Comienza a escribir una cuenta</h3>
                <p class="text-sm text-slate-400 mt-1">Puedes buscar por código exacto (ej. 1042, 4212) o por palabra clave (ej. "Caja", "Facturas").</p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-auto py-4 text-center text-xs text-slate-500">
        <p>Buscador Inteligente PCGE &bull; Diseñado para facilitar el trabajo contable</p>
    </footer>

    <!-- JavaScript Database & Logic -->

            { code: "421", name: "Facturas, boletas y otros comprobantes por pagar", element: "4. Pasivo", nature: "Acreedor" },

            { code: "423", name: "Letras por pagar", element: "4. Pasivo", nature: "Acreedor" },
            { code: "45", name: "Obligaciones financieras", element: "4. Pasivo", nature: "Acreedor" },
            { code: "451", name: "Préstamos de instituciones financieras", element: "4. Pasivo", nature: "Acreedor" },
            { code: "46", name: "Cuentas por pagar diversas - Terceros", element: "4. Pasivo", nature: "Acreedor" },
            { code: "469", name: "Otras cuentas por pagar diversas", element: "4. Pasivo", nature: "Acreedor" },

            // Elemento 5: PATRIMONIO NETO

            { code: "592", name: "Pérdidas acumuladas", element: "5. Patrimonio", nature: "Deudor" },

            // Elemento 6: GASTOS POR NATURALEZA
            { code: "60", name: "Compras", element: "6. Gastos", nature: "Deudor" },
            { code: "601", name: "Mercaderías", element: "6. Gastos", nature: "Deudor" },
            { code: "602", name: "Materias primas", element: "6. Gastos", nature: "Deudor" },
            { code: "603", name: "Materiales auxiliares, suministros y repuestos", element: "6. Gastos", nature: "Deudor" },

            { code: "84", name: "Resultado de explotación", element: "8. Saldos Intermediarios", nature: "Acreedor / Deudor" },
            { code: "85", name: "Resultado antes de participaciones e impuestos", element: "8. Saldos Intermediarios", nature: "Acreedor / Deudor" },

        const searchInput = document.getElementById('search-input');
        const clearBtn = document.getElementById('clear-btn');
        const resultsContainer = document.getElementById('results-container');

        function displayResults(results) {
            if (results.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="bg-white border border-slate-200 rounded-2xl p-8 text-center text-slate-500 shadow-sm">
                        <i class="fa-solid fa-triangle-exclamation text-3xl text-amber-500 mb-2"></i>
                        <h3 class="font-semibold text-slate-700 text-base">No se encontró ninguna cuenta</h3>
                        <p class="text-sm text-slate-400 mt-1">Verifica el número o intenta buscar por nombre descriptivo.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            results.forEach(item => {
                let badgeColor = "bg-slate-100 text-slate-700 border-slate-200";
                if(item.element.startsWith("1")) badgeColor = "bg-blue-50 text-blue-700 border-blue-200";
                if(item.element.startsWith("2")) badgeColor = "bg-amber-50 text-amber-700 border-amber-200";
                if(item.element.startsWith("3")) badgeColor = "bg-emerald-50 text-emerald-700 border-emerald-200";
                if(item.element.startsWith("4")) badgeColor = "bg-rose-50 text-rose-700 border-rose-200";
                if(item.element.startsWith("5")) badgeColor = "bg-purple-50 text-purple-700 border-purple-200";
                if(item.element.startsWith("6")) badgeColor = "bg-orange-50 text-orange-700 border-orange-200";
                if(item.element.startsWith("7")) badgeColor = "bg-teal-50 text-teal-700 border-teal-200";
                if(item.element.startsWith("8")) badgeColor = "bg-indigo-50 text-indigo-700 border-indigo-200";

                html += `
                    <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm hover:shadow-md transition-all flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div class="flex items-start gap-4">
                            <div class="bg-slate-900 text-white font-mono font-bold text-lg px-3.5 py-2 rounded-xl tracking-wider shrink-0 shadow-inner">
                                ${item.code}
                            </div>
                            <div>
                                <h3 class="font-semibold text-slate-800 text-base sm:text-lg leading-snug">${item.name}</h3>
                                <div class="flex flex-wrap items-center gap-2 mt-2">
                                    <span class="text-xs px-2.5 py-1 rounded-md font-medium border ${badgeColor}">
                                        ${item.element}
                                    </span>
                                    <span class="text-xs px-2.5 py-1 rounded-md font-medium bg-slate-100 text-slate-600 border border-slate-200">
                                        <i class="fa-solid fa-scale-balanced mr-1 opacity-70"></i> Naturaleza: ${item.nature}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            resultsContainer.innerHTML = html;
        }

        function handleSearch() {
            const query = searchInput.value.trim().toLowerCase();
            if (query.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
                resultsContainer.innerHTML = `
                    <div class="bg-white border border-dashed border-slate-300 rounded-2xl p-8 text-center text-slate-500">
                        <i class="fa-solid fa-file-invoice text-4xl text-blue-500 mb-3 opacity-80"></i>
                        <h3 class="font-semibold text-slate-700 text-base">Comienza a escribir una cuenta</h3>
                        <p class="text-sm text-slate-400 mt-1">Puedes buscar por código exacto (ej. 1042, 4212) o por palabra clave (ej. "Caja", "Facturas").</p>
                    </div>
                `;
                return;
            }

            const filtered = pcgeDatabase.filter(item => 
                item.code.toLowerCase().includes(query) || 
                item.name.toLowerCase().includes(query) ||
                item.element.toLowerCase().includes(query)
            );

            displayResults(filtered);
        }

        function filterByElement(elemNumber) {
            searchInput.value = "";
            clearBtn.classList.remove('hidden');
            const filtered = pcgeDatabase.filter(item => item.code.startsWith(elemNumber));
            displayResults(filtered);
            window.scrollTo({ top: 300, behavior: 'smooth' });
        }

        searchInput.addEventListener('input', handleSearch);

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.classList.add('hidden');
            resultsContainer.innerHTML = `
                <div class="bg-white border border-dashed border-slate-300 rounded-2xl p-8 text-center text-slate-500">
                    <i class="fa-solid fa-file-invoice text-4xl text-blue-500 mb-3 opacity-80"></i>
                    <h3 class="font-semibold text-slate-700 text-base">Comienza a escribir una cuenta</h3>
                    <p class="text-sm text-slate-400 mt-1">Puedes buscar por código exacto (ej. 1042, 4212) o por palabra clave (ej. "Caja", "Facturas").</p>
                </div>
            `;
            searchInput.focus();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador PCGE 2026 - Plan Contable General Empresarial</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full text-slate-100 flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 backdrop-blur-md px-4">
        <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 space-y-6">
            <div class="text-center space-y-2">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600/10 border border-indigo-500/20 text-indigo-400 mb-2 shadow-inner">
                    <i data-lucide="search-check" class="w-8 h-8"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Buscador PCGE 2026</h1>
                <p class="text-sm text-slate-400">Acceso al Sistema Contable</p>
            </div>

            <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
                <div class="space-y-1">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Usuario</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                            <i data-lucide="user" class="w-4 h-4"></i>
                        </span>
                        <input type="text" id="username" required class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all placeholder:text-slate-600" placeholder="admin">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Contraseña</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </span>
                        <input type="password" id="password" required class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all placeholder:text-slate-600" placeholder="admin">
                    </div>
                </div>

                <div id="login-error" class="hidden text-xs text-rose-400 bg-rose-950/30 border border-rose-900/50 p-3 rounded-lg text-center font-medium">
                    Credenciales incorrectas. Use: admin / admin
                </div>

                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium rounded-xl shadow-lg shadow-indigo-600/20 transition-all text-sm flex items-center justify-center space-x-2">
                    <span>Ingresar al Buscador</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP INTERFACE -->
    <div id="app-screen" class="hidden h-full flex flex-col overflow-hidden">
        <!-- Top Navbar -->
        <header class="h-16 border-b border-slate-800 bg-slate-900/50 backdrop-blur px-6 flex items-center justify-between shrink-0">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400">
                    <i data-lucide="compass" class="w-5 h-5"></i>
                </div>
                <div>
                    <h2 class="font-bold text-sm tracking-tight text-white">Buscador Inteligente PCGE 2026</h2>
                    <p class="text-xs text-slate-400">Consulta rápida de Cuentas, Activos, Pasivos y Dinámica</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="handleLogout()" class="flex items-center space-x-1.5 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg transition-colors border border-slate-700">
                    <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                    <span>Salir</span>
                </button>
            </div>
        </header>

        <!-- Workspace Layout -->
        <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
            <!-- Left Pane: Instant Search & List -->
            <aside class="w-full md:w-96 border-r border-slate-800 bg-slate-900/30 flex flex-col shrink-0">
                <div class="p-4 border-b border-slate-800 space-y-3">
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                            <i data-lucide="search" class="w-4 h-4"></i>
                        </span>
                        <input type="text" id="global-search" oninput="handleSearch()" placeholder="Buscar por número (ej. 10, 40) o nombre..." class="w-full pl-9 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs focus:outline-none focus:border-indigo-500 transition-all placeholder:text-slate-600 text-white font-medium">
                    </div>
                    <!-- Quick Category Pills -->
                    <div class="flex flex-wrap gap-1.5 pt-1" id="filter-pills">
                        <button onclick="filterByType('TODOS')" class="px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-indigo-600 text-white transition-colors category-pill" data-type="TODOS">Todos</button>
                        <button onclick="filterByType('ACTIVO')" class="px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition-colors category-pill" data-type="ACTIVO">Activos (1-3)</button>
                        <button onclick="filterByType('PASIVO')" class="px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition-colors category-pill" data-type="PASIVO">Pasivos (4)</button>
                        <button onclick="filterByType('PATRIMONIO')" class="px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition-colors category-pill" data-type="PATRIMONIO">Patrimonio (5)</button>
                        <button onclick="filterByType('RESULTADOS')" class="px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition-colors category-pill" data-type="RESULTADOS">Resultados (6-9)</button>
                    </div>
                </div>
                <div class="flex-1 overflow-y-auto p-3 space-y-1.5" id="accounts-results-list">
                    <!-- Populated dynamically -->
                </div>
            </aside>

            <!-- Right Pane: Detailed Account Card -->
            <main class="flex-1 bg-slate-950 overflow-y-auto p-6 md:p-10" id="detail-main-content">
                <!-- Loaded dynamically on selection -->
            </main>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        const pcgeData = [
            // Elemento 1
            { code: "10", name: "EFECTIVO Y EQUIVALENTES AL EFECTIVO", type: "ACTIVO", element: "Elemento 1: Activo Disponible y Exigible", content: "Agrupa las subcuentas que representan medios de pago como dinero en efectivo, cheques, giros, transferencias electrónicas, así como depósitos en instituciones financieras.", subs: ["101 Caja", "102 Fondos fijos", "103 Efectivo y cheques en tránsito", "104 Cuentas corrientes en instituciones financieras", "105 Otros equivalentes al efectivo", "106 Depósitos en instituciones financieras", "107 Fondos sujetos a restricción"], dynamics: "Debitado por entradas de efectivo, depósitos y notas de abono. Acreditado por pagos, transferencias y notas de cargo." },
            { code: "11", name: "INVERSIONES FINANCIERAS", type: "ACTIVO", element: "Elemento 1: Activo Disponible y Exigible", content: "Incluye inversiones financieras clasificadas según el modelo de negocio (costo amortizado, valor razonable con cambios en ORI, o valor razonable con cambios en resultados).", subs: ["111 Inversiones financieras medidas al costo amortizado", "112 Inversiones financieras medidas al valor razonable con cambios en resultados", "113 Inversiones financieras medidas al valor razonable con cambios en otros resultados integrales"], dynamics: "Debitado por el costo de adquisición y aumentos de valor razonable. Acreditado por la venta, redención o disminución de valor." },
            { code: "12", name: "CUENTAS POR COBRAR COMERCIALES - TERCEROS", type: "ACTIVO", element: "Elemento 1: Activo Disponible y Exigible", content: "Derechos de cobro a terceros derivados de la venta de bienes y/o servicios del objeto del negocio.", subs: ["121 Facturas, boletas y otros comprobantes por cobrar", "122 Anticipos recibidos", "123 Letras por cobrar"], dynamics: "Debitado por derechos de cobro generados por ventas. Acreditado por cobranzas parciales o totales y canje de documentos." },
            { code: "13", name: "CUENTAS POR COBRAR COMERCIALES - RELACIONADAS", type: "ACTIVO", element: "Elemento 1: Activo Disponible y Exigible", content: "Derechos de cobro a entidades relacionadas derivados de transacciones comerciales.", subs: ["131 Facturas, boletas y otros comprobantes por cobrar", "132 Anticipos recibidos", "133 Letras por cobrar"], dynamics: "Debitado por ventas a vinculadas. Acreditado por cobros y compensaciones." },
            { code: "14", name: "CUENTAS POR COBRAR AL PERSONAL, ACCIONISTAS Y DIRECTORES", type: "ACTIVO", element: "Elemento 1: Activo Disponible y Exigible", content: "Sumas adeudadas por personal, accionistas (o socios) y directores, distintas de operaciones comerciales.", subs: ["141 Personal", "142 Accionistas (o socios)", "143 Directores", "149 Diversas"], dynamics: "Debitado por préstamos y adelantos otorgados. Acreditado por pagos y devoluciones." },
            { code: "15", name: "ACTIVOS DEL CONTRATO Y COSTOS DE CONTRATOS", type: "ACTIVO", element: "Elemento 1: Activo Disponible y Exigible", content: "Derechos y costos relacionados con contratos con clientes conforme a la NIIF 15.", subs: ["151 Activos del contrato", "152 Costos para obtener contratos", "153 Costos para cumplir con el contrato"], dynamics: "Debitado por reconocimiento de activos del contrato y costos incurribles. Acreditado por amortización y facturación de la cuenta por cobrar." },
            { code: "16", name: "CUENTAS POR COBRAR DIVERSAS - TERCEROS", type: "ACTIVO", element: "Elemento 1: Activo Disponible y Exigible", content: "Derechos de cobro a terceros por transacciones distintas a las del objeto principal del negocio.", subs: ["161 Préstamos", "162 Reclamaciones a terceros", "163 Intereses, regalías y dividendos", "164 Depósitos otorgados en garantía", "165 Venta de activo inmovilizado", "167 Tributos por acreditar", "169 Otras cuentas por cobrar diversas"], dynamics: "Debitado por préstamos otorgados, reclamos e impuestos por acreditar. Acreditado por cobranzas y aplicaciones." },
            { code: "17", name: "CUENTAS POR COBRAR DIVERSAS - RELACIONADAS", type: "ACTIVO", element: "Elemento 1: Activo Disponible y Exigible", content: "Derechos de cobro a entidades relacionadas por transacciones distintas a ventas comerciales.", subs: ["171 Préstamos", "173 Intereses, regalías y dividendos", "174 Depósitos otorgados en garantía", "175 Venta de activo inmovilizado", "179 Otras cuentas por cobrar diversas"], dynamics: "Debitado por préstamos y conceptos diversos a vinculadas. Acreditado por cobros." },
            { code: "18", name: "SERVICIOS Y OTROS CONTRATADOS POR ANTICIPADO", type: "ACTIVO", element: "Elemento 1: Activo Disponible y Exigible", content: "Servicios contratados a recibir en el futuro o beneficios que se extienden más allá de un periodo económico.", subs: ["182 Seguros", "183 Alquileres", "189 Otros gastos contratados por anticipado"], dynamics: "Debitado por pagos anticipados de servicios. Acreditado por el consumo o devengo del servicio." },
            { code: "19", name: "DETERIORO POR PÉRDIDA CREDITICIA ESPERADA", type: "ACTIVO", element: "Elemento 1: Activo Disponible y Exigible", content: "Estimaciones acumuladas por pérdida crediticia esperada o incurrida de cuentas por cobrar.", subs: ["191 Cuentas por cobrar comerciales - Terceros", "192 Cuentas por cobrar comerciales - Relacionadas", "193 Cuentas por cobrar al personal, accionistas y directores", "194 Cuentas por cobrar diversas - Terceros", "195 Cuentas por cobrar diversas - Relacionadas", "196 Activos del contrato"], dynamics: "Debitado por recuperaciones o bajas de cuentas incobrables. Acreditado por la estimación de pérdida crediticia del periodo." },

            // Elemento 2
            { code: "20", name: "MERCADERÍAS", type: "ACTIVO", element: "Elemento 2: Activo Realizable", content: "Bienes adquiridos por la entidad para ser destinados a la venta sin someterlos a proceso de transformación.", subs: ["201 Mercaderías (Costo / Valor razonable)"], dynamics: "Debitado por costo de adquisiciones y devoluciones de clientes. Acreditado por costo de ventas y mermas." },
            { code: "21", name: "PRODUCTOS TERMINADOS", type: "ACTIVO", element: "Elemento 2: Activo Realizable", content: "Bienes fabricados o producidos por la entidad destinados a la venta, así como servicios prestados pendientes de facturación.", subs: ["211 Productos terminados", "215 Inventario de servicios prestados"], dynamics: "Debitado por producción concluida y devoluciones. Acreditado por la venta de productos terminados y servicios." },
            { code: "22", name: "SUBPRODUCTOS, DESECHOS Y DESPERDICIOS", type: "ACTIVO", element: "Elemento 2: Activo Realizable", content: "Productos accesorios obtenidos en la producción y residuos con valor de realización.", subs: ["221 Subproductos", "222 Desechos y desperdicios"], dynamics: "Debitado por reconocimiento inicial de subproductos y desechos. Acreditado por venta o baja de los mismos." },
            { code: "23", name: "PRODUCTOS EN PROCESO", type: "ACTIVO", element: "Elemento 2: Activo Realizable", content: "Bienes que se encuentran en proceso de manufactura o servicios en proceso.", subs: ["231 Productos en proceso", "235 Inventario de servicios en proceso"], dynamics: "Debitado por costos aplicados a la producción en proceso. Acreditado por transferencia a productos terminados." },
            { code: "24", name: "MATERIAS PRIMAS", type: "ACTIVO", element: "Elemento 2: Activo Realizable", content: "Insumos que intervienen directamente en los procesos de fabricación y quedan incorporados en el producto final.", subs: ["241 Materias primas"], dynamics: "Debitado por costo de adquisición. Acreditado por consumo en la producción." },
            { code: "25", name: "MATERIALES AUXILIARES, SUMINISTROS Y REPUESTOS", type: "ACTIVO", element: "Elemento 2: Activo Realizable", content: "Materiales complementarios, suministros de consumo y repuestos para mantenimiento.", subs: ["251 Materiales auxiliares", "252 Suministros (Combustibles, lubricantes, energía)", "253 Repuestos"], dynamics: "Debitado por adquisiciones. Acreditado por consumo en operaciones o mantenimiento." },
            { code: "26", name: "ENVASES Y EMBALAJES", type: "ACTIVO", element: "Elemento 2: Activo Realizable", content: "Bienes complementarios para la presentación y comercialización del producto.", subs: ["261 Envases", "262 Embalajes"], dynamics: "Debitado por compras. Acreditado por utilización en la comercialización." },
            { code: "27", name: "ACTIVOS NO CORRIENTES MANTENIDOS PARA LA VENTA", type: "ACTIVO", element: "Elemento 2: Activo Realizable", content: "Activos cuya recuperación se espera realizar principalmente a través de su venta en lugar de su uso continuado.", subs: ["271 Propiedades de inversión", "272 Propiedades, planta y equipo", "273 Activos intangibles", "279 Deterioro acumulado"], dynamics: "Debitado por transferencia desde cuentas de activo inmovilizado. Acreditado por la venta o baja del activo." },
            { code: "28", name: "INVENTARIOS POR RECIBIR", type: "ACTIVO", element: "Elemento 2: Activo Realizable", content: "Bienes aún no ingresados al almacén por los cuales se ha incurrido en costos de adquisición.", subs: ["281 Mercaderías", "284 Materias primas", "285 Materiales auxiliares, suministros y repuestos", "286 Envases y embalajes"], dynamics: "Debitado por el valor de inventarios en tránsito o por recibir. Acreditado por el ingreso físico a almacén." },
            { code: "29", name: "DESVALORIZACIÓN DE INVENTARIOS", type: "ACTIVO", element: "Elemento 2: Activo Realizable", content: "Estimaciones acumuladas para cubrir la pérdida de valor de los inventarios.", subs: ["291 Mercaderías", "292 Productos terminados", "293 Subproductos, desechos y desperdicios", "294 Productos en proceso", "295 Materias primas", "296 Materiales auxiliares, suministros y repuestos", "297 Envases y embalajes", "298 Inventarios por recibir"], dynamics: "Debitado por retiro de inventarios sin valor o reversión de estimación. Acreditado por estimación de desvalorización del periodo." },

            // Elemento 3
            { code: "30", name: "INVERSIONES EN SUBSIDIARIAS, ASOCIADAS Y NEGOCIOS CONJUNTOS", type: "ACTIVO", element: "Elemento 3: Activo Inmovilizado", content: "Inversiones en entidades bajo control, influencia significativa o control conjunto.", subs: ["301 Subsidiarias", "302 Asociadas", "303 Negocios conjuntos"], dynamics: "Debitado por costo de adquisición y aumento por método de participación. Acreditado por venta o pérdidas patrimoniales." },
            { code: "31", name: "PROPIEDADES DE INVERSIÓN", type: "ACTIVO", element: "Elemento 3: Activo Inmovilizado", content: "Terrenos o edificaciones mantenidos para obtener rentas o plusvalía.", subs: ["311 Terrenos", "312 Edificaciones", "313 Construcciones en curso"], dynamics: "Debitado por costo de adquisición o construcción. Acreditado por venta, retiro o transferencia." },
            { code: "32", name: "ACTIVOS POR DERECHO DE USO", type: "ACTIVO", element: "Elemento 3: Activo Inmovilizado", content: "Activos adquiridos bajo la modalidad de arrendamiento financiero u operativo importante (NIIF 16).", subs: ["321 Propiedades de inversión - Arrendamiento financiero", "322 Propiedades, planta y equipo - Arrendamiento financiero"], dynamics: "Debitado por el reconocimiento inicial del derecho de uso. Acreditado por devolución o transferencia al ejercer opción de compra." },
            { code: "33", name: "PROPIEDADES, PLANTA Y EQUIPO", type: "ACTIVO", element: "Elemento 3: Activo Inmovilizado", content: "Activos tangibles para uso en producción, suministro de bienes/servicios o fines administrativos por más de un periodo.", subs: ["330 Planta productora", "331 Terrenos", "332 Edificaciones", "333 Maquinarias y equipos de explotación", "334 Unidades de transporte", "335 Muebles y enseres", "336 Equipos diversos", "337 Piezas de repuesto", "338 Unidades por recibir", "339 Obras en curso"], dynamics: "Debitado por costo de adquisición, mejora o revaluación. Acreditado por venta, retiro o desapropiación." },
            { code: "34", name: "ACTIVOS INTANGIBLES", type: "ACTIVO", element: "Elemento 3: Activo Inmovilizado", content: "Activos identificables de carácter no monetario y sin sustancia física (concesiones, software, patentes, criptoactivos, plusvalía).", subs: ["341 Concesiones, licencias y otros derechos", "342 Patentes y propiedad industrial", "343 Programas de computadora (software)", "344 Costos de exploración y desarrollo", "345 Fórmulas, diseños y prototipos", "347 Plusvalía", "348 Criptoactivos", "349 Otros activos intangibles"], dynamics: "Debitado por costo de adquisición o desarrollo. Acreditado por venta, retiro o amortización." },
            { code: "35", name: "ACTIVOS BIOLÓGICOS", type: "ACTIVO", element: "Elemento 3: Activo Inmovilizado", content: "Animales vivos y plantas que forman parte de una actividad agrícola, pecuaria o piscícola.", subs: ["351 Activos biológicos en producción", "352 Activos biológicos en desarrollo"], dynamics: "Debitado por costos de desarrollo y valor razonable. Acreditado por venta, cosecha o retiro." },
            { code: "36", name: "DETERIORO DE ACTIVO INMOVILIZADO", type: "ACTIVO", element: "Elemento 3: Activo Inmovilizado", content: "Estimaciones de pérdida de valor para activos inmovilizados medidos al costo.", subs: ["361 Deterioro de propiedades de inversión", "363 Deterioro de PPE - Arrendamiento financiero", "364 Deterioro de propiedades, planta y equipo", "365 Deterioro de activos intangibles", "366 Deterioro de activos biológicos", "367 Deterioro de inversiones en subsidiarias, asociadas y negocios conjuntos"], dynamics: "Debitado por reversión de pérdidas por deterioro. Acreditado por la estimación del deterioro del periodo." },
            { code: "37", name: "ACTIVO POR IMPUESTO A LAS GANANCIAS DIFERIDO", type: "ACTIVO", element: "Elemento 3: Activo Inmovilizado", content: "Activos generados por diferencias temporarias deducibles y derecho a compensar pérdidas tributarias.", subs: ["371 Impuesto a las ganancias diferido"], dynamics: "Debitado por el importe del activo por diferencias temporarias o pérdidas compensables. Acreditado por la reversión del activo diferido." },
            { code: "38", name: "OTROS ACTIVOS", type: "ACTIVO", element: "Elemento 3: Activo Inmovilizado", content: "Bienes no destinados a la venta ni al desarrollo operativo habitual (obras de arte, bibliotecas, monedas).", subs: ["381 Bienes de arte y cultura", "382 Diversos"], dynamics: "Debitado por costo de adquisición. Acreditado por venta o retiro de los bienes." },
            { code: "39", name: "DEPRECIACIÓN Y AMORTIZACIÓN ACUMULADAS", type: "ACTIVO", element: "Elemento 3: Activo Inmovilizado", content: "Distribución sistemática del importe depreciable/amortizable de un activo a lo largo de su vida útil.", subs: ["391 Depreciación acumulada de propiedades de inversión", "392 Depreciación acumulada de PI - Arrendamiento financiero", "393 Depreciación acumulada de PPE - Arrendamiento financiero", "395 Depreciación acumulada de propiedades, planta y equipo", "396 Amortización acumulada", "398 Depreciación acumulada - Activos biológicos"], dynamics: "Debitado por retiro de depreciación de activos vendidos o dados de baja. Acreditado por la depreciación y amortización del periodo." },

            // Elemento 4 (Pasivo)
            { code: "40", name: "TRIBUTOS, CONTRAPRESTACIONES Y APORTES AL SISTEMA PÚBLICO DE PENSIONES Y DE SALUD POR PAGAR", type: "PASIVO", element: "Elemento 4: Pasivo", content: "Obligaciones por impuestos, contribuciones y tributos a cargo propio o como agente retenedor.", subs: ["401 Gobierno nacional (IGV, Renta)", "402 Certificados tributarios", "403 Instituciones públicas (ESSALUD, ONP)", "405 Gobiernos regionales", "406 Gobiernos locales (Impuesto predial, arbitrios)", "409 Sanciones y otros costos administrativos"], dynamics: "Debitado por pagos de obligaciones tributarias y compensaciones. Acreditado por tributos devengados e impuestos retenidos." },
            { code: "41", name: "REMUNERACIONES Y PARTICIPACIONES POR PAGAR", type: "PASIVO", element: "Elemento 4: Pasivo", content: "Obligaciones devengadas con los trabajadores por remuneraciones, beneficios sociales y participaciones.", subs: ["411 Remuneraciones por pagar", "413 Participaciones de los trabajadores por pagar", "415 Beneficios sociales (CTS, pensiones)", "417 Administradoras de fondos de pensiones (AFP)", "419 Otras remuneraciones y participaciones por pagar"], dynamics: "Debitado por pagos efectuados a trabajadores y AFPs. Acreditado por remuneraciones y beneficios devengados." },
            { code: "42", name: "CUENTAS POR PAGAR COMERCIALES - TERCEROS", type: "PASIVO", element: "Elemento 4: Pasivo", content: "Obligaciones contraídas con proveedores por compra de bienes y servicios del objeto del negocio.", subs: ["421 Facturas, boletas y otros comprobantes por pagar", "422 Anticipos otorgados (naturaleza deudora)", "423 Letras por pagar", "424 Honorarios por pagar", "425 Acuerdos de financiamiento"], dynamics: "Debitado por pagos parciales o totales a proveedores. Acreditado por la recepción de bienes y servicios." },
            { code: "43", name: "CUENTAS POR PAGAR COMERCIALES - RELACIONADAS", type: "PASIVO", element: "Elemento 4: Pasivo", content: "Obligaciones contraídas con entidades relacionadas por compras de bienes y servicios.", subs: ["431 Facturas, boletas y otros comprobantes por pagar", "432 Anticipos otorgados", "433 Letras por pagar", "434 Honorarios por pagar"], dynamics: "Debitado por pagos a vinculadas. Acreditado por compras de bienes y servicios a relacionadas." },
            { code: "44", name: "CUENTAS POR PAGAR A LOS ACCIONISTAS Y DIRECTORES", type: "PASIVO", element: "Elemento 4: Pasivo", content: "Sumas adeudadas a accionistas y directores por préstamos, dividendos o dietas.", subs: ["441 Accionistas (socios, partícipes)", "442 Directores"], dynamics: "Debitado por pagos y capitalización de préstamos. Acreditado por préstamos recibidos, dividendos y dietas devengadas." },
            { code: "45", name: "OBLIGACIONES FINANCIERAS", type: "PASIVO", element: "Elemento 4: Pasivo", content: "Obligaciones por operaciones de financiación con instituciones financieras y emisión de instrumentos de deuda.", subs: ["451 Préstamos de instituciones financieras y otras entidades", "452 Contratos de arrendamiento financiero", "453 Obligaciones emitidas (bonos, papeles comerciales)", "454 Otros instrumentos financieros por pagar", "455 Costos por préstamos por pagar", "456 Préstamos con compromisos de recompra"], dynamics: "Debitado por pagos de principal de préstamos. Acreditado por obtención de financiamientos y costos devengados." },
            { code: "46", name: "CUENTAS POR PAGAR DIVERSAS - TERCEROS", type: "PASIVO", element: "Elemento 4: Pasivo", content: "Obligaciones con terceros por transacciones distintas a comerciales, tributarias o financieras.", subs: ["461 Reclamaciones de terceros", "462 Pasivos por arrendamiento por derecho de uso", "463 Pasivos por reembolsos", "464 Pasivos por instrumentos financieros", "465 Pasivos por compra de activo inmovilizado", "466 Participación de terceros en acuerdos conjuntos", "467 Depósitos recibidos en garantía", "469 Otras cuentas por pagar diversas (subsidios)"], dynamics: "Debitado por pagos y devoluciones de garantías. Acreditado por reclamaciones, compra de inmovilizados y depósitos recibidos." },
            { code: "47", name: "CUENTAS POR PAGAR DIVERSAS - RELACIONADAS", type: "PASIVO", element: "Elemento 4: Pasivo", content: "Obligaciones a favor de entidades relacionadas por operaciones diferentes a las comerciales y financieras.", subs: ["471 Préstamos", "472 Costos por préstamos", "473 Anticipos recibidos", "474 Regalías", "475 Dividendos", "476 Depósitos recibidos en garantía", "477 Pasivo por compra de activo inmovilizado", "479 Otras cuentas por pagar diversas"], dynamics: "Debitado por pagos efectuados a relacionadas. Acreditado por préstamos recibidos, dividendos o compras de activo inmovilizado." },
            { code: "48", name: "PROVISIONES", type: "PASIVO", element: "Elemento 4: Pasivo", content: "Valores estimados por obligaciones de monto u oportunidad inciertos (litigios, desmantelamiento, garantías).", subs: ["481 Provisión para litigios", "482 Provisión por desmantelamiento, retiro o rehabilitación del inmovilizado", "483 Provisión para reestructuraciones", "484 Provisión para protección y remediación del medio ambiente", "485 Provisión para gastos de responsabilidad social", "486 Provisión para garantías", "489 Otras provisiones"], dynamics: "Debitado por transferencia a pasivos ciertos o reversión de provisiones. Acreditado por estimación de nuevas provisiones." },
            { code: "49", name: "PASIVO DIFERIDO", type: "PASIVO", element: "Elemento 4: Pasivo", content: "Pasivos por impuestos generados por diferencias temporarias gravables y subsidios recibidos diferidos.", subs: ["491 Impuesto a las ganancias diferido", "492 Ganancia por venta con arrendamiento posterior", "493 Subsidios recibidos diferidos", "494 Pasivo del contrato"], dynamics: "Debitado por el reconocimiento en resultados de ingresos diferidos. Acreditado por el registro de diferencias temporarias gravables y subsidios." },

            { code: "51", name: "ACCIONES DE INVERSIÓN", type: "PATRIMONIO", element: "Elemento 5: Patrimonio", content: "Acciones sin derecho a voto emitidas conforme a ley que otorgan derechos económicos.", subs: ["511 Acciones de inversión", "512 Acciones de inversión en tesorería"], dynamics: "Debitado por redención de acciones de inversión. Acreditado por aumentos de acciones de inversión." },
            { code: "52", name: "CAPITAL ADICIONAL", type: "PATRIMONIO", element: "Elemento 5: Patrimonio", content: "Primas (descuentos) de acciones y aportes en proceso de formalización legal.", subs: ["521 Primas (descuento) de acciones", "522 Capitalizaciones en trámite", "523 Reducciones de capital pendientes de formalización", "524 Pago basado en acciones"], dynamics: "Debitado por capitalización parcial o total. Acreditado por primas de emisión y aportes pendientes de formalización." },
            { code: "56", name: "RESULTADOS NO REALIZADOS", type: "PATRIMONIO", element: "Elemento 5: Patrimonio", content: "Ganancias o pérdidas por diferencia de cambio en inversión neta en el extranjero e instrumentos de cobertura.", subs: ["561 Diferencia de cambio de inversión neta en el extranjero", "562 Instrumentos financieros - Coberturas", "565 Resultado en activos o pasivos financieros - Compra o venta convencional"], dynamics: "Debitado por pérdidas en coberturas o inversión extranjera. Acreditado por ganancias en coberturas o conversión extranjera." },
            { code: "57", name: "EXCEDENTE DE REVALUACIÓN", type: "PATRIMONIO", element: "Elemento 5: Patrimonio", content: "Variaciones en propiedades, planta y equipo, intangibles y activos mineros objeto de revaluación.", subs: ["571 Excedente de revaluación (PPE, Intangibles, Impuesto diferido)"], dynamics: "Debitado por liberación de excedente por depreciación o venta del activo revaluado. Acreditado por el mayor valor en revaluación de activos." },
            { code: "58", name: "RESERVAS", type: "PATRIMONIO", element: "Elemento 5: Patrimonio", content: "Apropiaciones de utilidades autorizadas por ley, estatutos o acuerdos de accionistas.", subs: ["581 Reinversión", "582 Legal", "583 Contractuales", "584 Estatutarias", "585 Facultativas", "586 Participación en otros cambios patrimoniales de relacionadas", "589 Otras reservas"], dynamics: "Debitado por capitalización o cobertura de pérdidas. Acreditado por detracciones de utilidades (reserva legal, estatutaria)." },
            { code: "59", name: "RESULTADOS ACUMULADOS", type: "PATRIMONIO", element: "Elemento 5: Patrimonio", content: "Utilidades no distribuidas y pérdidas acumuladas sobre las que no se han tomado decisiones.", subs: ["591 Utilidades no distribuidas", "592 Pérdidas acumuladas", "593 Efectos de adopción por primera vez de las NIIF"], dynamics: "Debitado por pérdida del periodo, distribución de dividendos o corrección de errores. Acreditado por utilidad del periodo o aplicación de resultados." },

            // Elementos 6 al 9 (Resultados / Gastos / Ingresos)
            { code: "60", name: "COMPRAS", type: "RESULTADOS", element: "Elemento 6: Gastos por Naturaleza", content: "Acumula las compras de bienes destinados a la venta o al proceso productivo.", subs: ["601 Mercaderías", "602 Materias primas", "603 Materiales auxiliares, suministros y repuestos", "604 Envases y embalajes", "605 Descuentos obtenidos por pronto pago", "606 Descuentos y bonificaciones obtenidos", "609 Costos vinculados con las compras"], dynamics: "Debitado por compras de bienes. Acreditado por devolución o cierre del periodo." },
            { code: "61", name: "VARIACIÓN DE INVENTARIOS", type: "RESULTADOS", element: "Elemento 6: Gastos por Naturaleza", content: "Variaciones en los saldos de inventarios de mercaderías, materias primas, suministros y envases.", subs: ["611 Mercaderías", "612 Materias primas", "613 Materiales auxiliares, suministros y repuestos", "614 Envases y embalajes"], dynamics: "Debitado por consumo de materias primas. Acreditado por incorporación de compras a inventarios." },
            { code: "62", name: "GASTOS DE PERSONAL Y DIRECTORES", type: "RESULTADOS", element: "Elemento 6: Gastos por Naturaleza", content: "Remuneraciones, contribuciones sociales y retribuciones al directorio.", subs: ["621 Remuneraciones", "622 Otras remuneraciones", "623 Indemnizaciones", "624 Capacitación", "625 Atención al personal", "627 Seguridad y previsión social", "628 Retribuciones al directorio", "629 Beneficios sociales"], dynamics: "Debitado por remuneraciones y contribuciones de ley. Acreditado al cierre del periodo." },
            { code: "63", name: "GASTOS DE SERVICIOS PRESTADOS POR TERCEROS", type: "RESULTADOS", element: "Elemento 6: Gastos por Naturaleza", content: "Gastos de servicios prestados a la entidad por terceros (transporte, asesoría, alquileres, básicos).", subs: ["631 Transporte y gastos de viaje", "632 Asesoría y consultoría", "633 Producción encargada a terceros", "634 Mantenimiento y reparaciones", "635 Alquileres", "636 Servicios básicos", "637 Publicidad y relaciones públicas", "638 Servicios de contratistas", "639 Otros servicios de terceros"], dynamics: "Debitado por servicios recibidos. Acreditado al cierre del periodo." },
            { code: "64", name: "GASTOS POR TRIBUTOS", type: "RESULTADOS", element: "Elemento 6: Gastos por Naturaleza", content: "Impuestos, tasas y contribuciones a cargo de la entidad y gastos en deuda tributaria.", subs: ["641 Gobierno nacional", "642 Gobierno regional", "643 Gobierno local", "644 Otros gastos por tributos", "645 Gastos en deuda tributaria"], dynamics: "Debitado por tributos devengados y multas. Acreditado al cierre del periodo." },
            { code: "65", name: "OTROS GASTOS DE GESTIÓN", type: "RESULTADOS", element: "Elemento 6: Gastos por Naturaleza", content: "Gastos de gestión distintos de producción o remuneraciones (seguros, regalías, suministros).", subs: ["650 Gestión medioambiental", "651 Seguros", "652 Regalías", "653 Suscripciones", "654 Licencias", "655 Costo neto de enajenación de activos", "656 Suministros", "658 Diferencia de cambio", "659 Otros gastos de gestión"], dynamics: "Debitado por primas de seguros y valor contable de inmovilizados vendidos. Acreditado al cierre." },
            { code: "66", name: "PÉRDIDA POR MEDICIÓN DE ACTIVOS AL VALOR RAZONABLE", type: "RESULTADOS", element: "Elemento 6: Gastos por Naturaleza", content: "Disminuciones de valor en activos no financieros medidos a valor razonable.", subs: ["661 Activo realizable", "662 Activo inmovilizado"], dynamics: "Debitado por pérdida de valor por medición a valor razonable. Acreditado al cierre." },
            { code: "67", name: "GASTOS FINANCIEROS", type: "RESULTADOS", element: "Elemento 6: Gastos por Naturaleza", content: "Intereses y gastos relacionados exclusivamente con la obtención de financiamiento.", subs: ["671 Gastos en endeudamiento", "672 Pérdida por derivados", "673 Intereses por préstamos y obligaciones", "674 Gastos en factoring", "676 Diferencia de cambio", "677 Pérdida por medición de activos/pasivos financieros a valor razonable", "679 Otros gastos financieros"], dynamics: "Debitado por intereses y comisiones financieras. Acreditado al cierre." },
            { code: "68", name: "VALUACIÓN Y DETERIORO DE ACTIVOS Y PROVISIONES", type: "RESULTADOS", element: "Elemento 6: Gastos por Naturaleza", content: "Consumo de beneficio económico de activos inmovilizados, pérdidas de valor y provisiones.", subs: ["681 Depreciación de propiedades de inversión", "683 Depreciación de PPE", "686 Amortización de intangibles", "687 Valuación de activos", "688 Deterioro del valor de activos", "689 Provisiones"], dynamics: "Debitado por estimación de depreciación, deterioro y provisiones. Acreditado al cierre." },
            { code: "69", name: "COSTO DE VENTAS", type: "RESULTADOS", element: "Elemento 6: Gastos por Naturaleza", content: "Costo de los bienes y/o servicios inherentes al giro del negocio transferidos a título oneroso.", subs: ["691 Mercaderías", "692 Productos terminados", "693 Servicios prestados", "694 Subproductos y desechos", "695 Gastos por deterioro de inventarios"], dynamics: "Debitado por el costo de bienes y servicios vendidos. Acreditado por devoluciones o cierre." },
            { code: "70", name: "VENTAS", type: "RESULTADOS", element: "Elemento 7: Ingresos por Naturaleza", content: "Ingresos por ventas de bienes y/o servicios inherentes a las operaciones del giro del negocio.", subs: ["701 Mercaderías", "702 Productos terminados", "703 Servicios prestados", "706 Descuentos concedidos", "707 Ingresos como agente", "709 Devoluciones sobre ventas"], dynamics: "Debitado por devoluciones sobre ventas. Acreditado por el importe de las ventas." },
            { code: "75", name: "OTROS INGRESOS DE GESTIÓN", type: "RESULTADOS", element: "Elemento 7: Ingresos por Naturaleza", content: "Ingresos distintos de la actividad principal (comisiones, regalías, alquileres).", subs: ["751 Servicios en beneficio del personal", "752 Comisiones y corretajes", "753 Regalías", "754 Alquileres", "755 Recuperación de deterioro", "756 Enajenación de activos inmovilizados", "758 Diferencia de cambio", "759 Otros ingresos de gestión"], dynamics: "Debitado al cierre. Acreditado por ingresos diversos no operativos." },
            { code: "77", name: "INGRESOS FINANCIEROS", type: "RESULTADOS", element: "Elemento 7: Ingresos por Naturaleza", content: "Rentas o rendimientos por colocación de capitales, dividendos y diferencia de cambio.", subs: ["771 Ganancia por derivados", "773 Dividendos", "776 Diferencia de cambio", "777 Ganancia por medición a valor razonable", "778 Intereses por préstamos bajo tasa efectiva", "779 Otros ingresos financieros"], dynamics: "Debitado al cierre. Acreditado por intereses y rendimientos financieros ganados." },
            { code: "88", name: "IMPUESTO A LAS GANANCIAS", type: "RESULTADOS", element: "Elemento 8: Resultados", content: "Impuesto calculado sobre la renta imponible del periodo (corriente) y componente diferido.", subs: ["881 Impuesto a las ganancias - Corriente", "882 Impuesto a las ganancias - Diferido"], dynamics: "Debitado por impuesto corriente y gasto diferido. Acreditado al cierre." },
            { code: "91", name: "GASTOS DE OPERACIÓN", type: "RESULTADOS", element: "Elemento 9: Gastos por Categoría", content: "Gastos relacionados con las actividades ordinarias de la entidad (administración, ventas).", subs: ["911 Gastos de administración", "912 Gastos de ventas"], dynamics: "Debitado por asignación de gastos por función. Acreditado al cierre." }
        ];

        let activeFilter = 'TODOS';

        // Authentication Handler
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('login-error');

            if (user === 'admin' && pass === 'admin') {
                localStorage.setItem('pcge_logged', 'true');
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                initApp();
            } else {
                errorDiv.classList.remove('hidden');
            }
        }

        function handleLogout() {
            localStorage.removeItem('pcge_logged');
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('login-error').classList.add('hidden');
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('pcge_logged') === 'true') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                initApp();
            }
            lucide.createIcons();
        });

        function initApp() {
            renderAccountsList(pcgeData);
            renderDetail(pcgeData[0]);
            lucide.createIcons();
        }

        function filterByType(type) {
            activeFilter = type;
            // Update active pill styling
            document.querySelectorAll('.category-pill').forEach(pill => {
                if (pill.getAttribute('data-type') === type) {
                    pill.className = "px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-indigo-600 text-white transition-colors category-pill";
                } else {
                    pill.className = "px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition-colors category-pill";
                }
            });
            handleSearch();
        }

        function handleSearch() {
            const query = document.getElementById('global-search').value.toLowerCase().trim();
            
            const filtered = pcgeData.filter(acc => {
                const matchesType = activeFilter === 'TODOS' || acc.type === activeFilter;
                const matchesQuery = acc.code.toLowerCase().includes(query) || 
                                     acc.name.toLowerCase().includes(query) || 
                                     acc.content.toLowerCase().includes(query);
                return matchesType && matchesQuery;
            });

            renderAccountsList(filtered);
        }

        function renderAccountsList(list) {
            const container = document.getElementById('accounts-results-list');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = `<div class="p-4 text-center text-xs text-slate-500">No se encontraron cuentas con ese criterio.</div>`;
                return;
            }

            list.forEach(acc => {
                let badgeColor = 'bg-slate-800 text-slate-300 border-slate-700';
                if (acc.type === 'ACTIVO') badgeColor = 'bg-emerald-950/60 text-emerald-400 border-emerald-800/50';
                if (acc.type === 'PASIVO') badgeColor = 'bg-rose-950/60 text-rose-400 border-rose-800/50';
                if (acc.type === 'PATRIMONIO') badgeColor = 'bg-amber-950/60 text-amber-400 border-amber-800/50';
                if (acc.type === 'RESULTADOS') badgeColor = 'bg-indigo-950/60 text-indigo-400 border-indigo-800/50';

                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-3 rounded-xl bg-slate-900/60 hover:bg-slate-800 border border-slate-800/80 transition-all flex items-center justify-between group cursor-pointer';
                btn.onclick = () => renderDetail(acc);
                btn.innerHTML = `
                    <div class="space-y-1 pr-2 truncate">
                        <div class="flex items-center space-x-2">
                            <span class="font-mono font-bold text-sm text-indigo-400">${acc.code}</span>
                            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full border ${badgeColor}">${acc.type}</span>
                        </div>
                        <p class="text-xs font-medium text-slate-200 truncate">${acc.name}</p>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-600 group-hover:text-slate-300 shrink-0"></i>
                `;
                container.appendChild(btn);
            });
            lucide.createIcons();
        }

        function renderDetail(acc) {
            let badgeColor = 'bg-slate-800 text-slate-300 border-slate-700';
            let badgeIcon = 'layers';
            if (acc.type === 'ACTIVO') { badgeColor = 'bg-emerald-950/60 text-emerald-400 border-emerald-800/50'; badgeIcon = 'arrow-up-right'; }
            if (acc.type === 'PASIVO') { badgeColor = 'bg-rose-950/60 text-rose-400 border-rose-800/50'; badgeIcon = 'arrow-down-left'; }
            if (acc.type === 'PATRIMONIO') { badgeColor = 'bg-amber-950/60 text-amber-400 border-amber-800/50'; badgeIcon = 'shield'; }
            if (acc.type === 'RESULTADOS') { badgeColor = 'bg-indigo-950/60 text-indigo-400 border-indigo-800/50'; badgeIcon = 'bar-chart-3'; }

            const main = document.getElementById('detail-main-content');
            main.innerHTML = `
                <div class="max-w-3xl mx-auto space-y-6 pb-12 animate-fadeIn">
                    <!-- Title & Type Card -->
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 space-y-4 shadow-xl">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <span class="px-3.5 py-1.5 bg-indigo-600 text-white font-mono font-bold text-base rounded-xl shadow-md shadow-indigo-600/30">${acc.code}</span>
                            <span class="inline-flex items-center space-x-1.5 text-xs font-bold px-3 py-1 rounded-full border ${badgeColor}">
                                <i data-lucide="${badgeIcon}" class="w-3.5 h-3.5"></i>
                                <span>${acc.type}</span>
                            </span>
                        </div>
                        <h1 class="text-xl md:text-2xl font-bold tracking-tight text-white">${acc.name}</h1>
                        <p class="text-xs font-semibold uppercase tracking-wider text-indigo-400">${acc.element}</p>
                        <p class="text-slate-300 text-sm leading-relaxed pt-2">${acc.content}</p>
                    </div>

                    <!-- Subcuentas -->
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 space-y-4 shadow-xl">
                        <h3 class="text-xs font-semibold uppercase tracking-wider text-indigo-400 flex items-center space-x-2">
                            <i data-lucide="list-tree" class="w-4 h-4"></i>
                            <span>Desglose de Subcuentas</span>
                        </h3>
                        <ul class="grid grid-cols-1 gap-2">
                            ${acc.subs.map(sub => `
                                <li class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 text-xs text-slate-200 flex items-center space-x-2.5">
                                    <span class="w-2 h-2 rounded-full bg-indigo-500 shrink-0"></span>
                                    <span class="font-medium">${sub}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>

                    <!-- Dinámica Contable -->
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 space-y-4 shadow-xl">
                        <h3 class="text-xs font-semibold uppercase tracking-wider text-emerald-400 flex items-center space-x-2">
                            <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
                            <span>Dinámica Contable (Débitos y Créditos)</span>
                        </h3>
                        <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-4 text-xs text-slate-300 leading-relaxed font-mono">
                            ${acc.dynamics}
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }
    </script>
</body>
</html>
